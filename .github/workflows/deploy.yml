name: Deploy
# Deploys palisec.tech from this repository through the Vercel CLI (Vercel's Hobby plan cannot connect
# to private organization repositories itself). Off until the VERCEL_TOKEN secret and the VERCEL_ORG_ID /
# VERCEL_PROJECT_ID variables are set. Migrations run in the build, as they did on Vercel.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.VERCEL_PROJECT_ID != '' && vars.VERCEL_ORG_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@65.12.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Source upload and a build on Vercel, as with the Git connection: only changed files are uploaded
      # (a prebuilt upload sends every build file each time and hits the Hobby daily upload limit).
      # Without git metadata: Hobby blocks deployments whose commit author is not the account owner.
      - name: Deploy to production
        run: |
          rm -rf .git
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
      - name: The site answers
        run: |
          for i in 1 2 3 4 5 6; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://palisec.tech/login); [ "$code" = 200 ] && { echo OK; exit 0; }; sleep 10; done
          echo "::error::palisec.tech/login did not answer 200"; exit 1
