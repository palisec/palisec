name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these same checks as its gate.
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The Rust policy engine: native parity against the shared fixtures, and a WebAssembly build.
  # (pnpm test in `verify` checks the embedded WebAssembly against the reference on random cases
  # and refuses one not built from the current source.)
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/policy-engine
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-unknown-unknown

  # The API against real Postgres: budget atomicity under concurrency, replay, roles, approvals, audit.
  # Uses the public testnet RPC and price feeds, as production does.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PALISEC_EXTRA_HOSTS: localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Local receiver for the webhook tests; ignored on Vercel.
      PALISEC_TEST_WEBHOOK_ORIGIN: http://127.0.0.1:4555
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build applies the migrations, exactly as on Vercel.
      - run: pnpm --filter @palisec/web build
      - name: Start the server
        run: |
          # A throwaway key for webhook secrets in this run only.
          export PALISEC_SECRETS_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64'))")
          pnpm --filter @palisec/web start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health | grep -q '"database":"ok"' && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: BASE_URL=http://localhost:3000 node apps/web/scripts/e2e-api.mjs
      # The published SDK (built by the web build) against the same server.
      - run: BASE_URL=http://localhost:3000 node packages/sdk/scripts/integration.mjs
      # The served Python wheel against the same server.
      - run: BASE_URL=http://localhost:3000 node packages/sdk-python/scripts/integration.mjs
      # PALISEC Connect: scopes, rotation, isolation, webhooks, security findings, MCP.
      - run: BASE_URL=http://localhost:3000 node apps/web/scripts/e2e-connect.mjs
      # Hostile input: malformed, oversized and forged requests. Last, because its burst spends the rate limit.
      - run: BASE_URL=http://localhost:3000 node apps/web/scripts/adversarial.mjs
      - if: failure()
        run: cat server.log
