name: Uptime
# Hourly check that the site answers. Off until the repository variable UPTIME_ENABLED is "true".
# It loads /login, a static page, so the check itself never wakes the database (the optional registry sync
# and loss-limit steps below do, once an hour). A failed run emails the owner.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: vars.UPTIME_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sign-in page answers over HTTPS
        env:
          URL: ${{ vars.UPTIME_URL || 'https://palisec.tech/login' }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL") && [ "$code" = "200" ] && { echo "OK $URL"; exit 0; }
            echo "Attempt $attempt: HTTP ${code:-none}"; sleep 20
          done
          echo "::error::$URL did not answer 200 after 3 attempts"; exit 1
      - name: Publish policy commitments (Phase 8 registry sync; sends nothing when the chain already matches)
        if: vars.PEAA_SYNC_ENABLED == 'true'
        run: |
          curl -s --max-time 120 -X POST -H 'origin: https://palisec.tech' https://palisec.tech/api/v1/public/peaa/sync | head -c 2000; echo
      - name: Measure accounts with a loss limit (Phase 9; prints counts only, because this log is public)
        if: vars.LOSS_SNAPSHOT_ENABLED == 'true'
        run: |
          body=$(curl -s --max-time 120 -X POST -H 'origin: https://palisec.tech' https://palisec.tech/api/v1/public/loss/snapshot) || true
          printf '%s' "$body" | grep -oE '"(accounts|measured|unavailable|paused)":[0-9]+' | tr '\n' ' '; echo
